# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Payload CMS 3 (Next.js + admin + REST). Setups: `prod` and `dev` only.

zerops:
  - setup: prod
    build:
      base: nodejs@24
      envVariables:
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=4096
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
      buildCommands:
        - npm ci --include=dev
        - npx payload migrate
        - npx payload generate:importmap
        - npm run build
      deployFiles:
        - .next/standalone
        - .next/static
        - public
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /admin
    run:
      base: nodejs@24
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        SERVER_URL: ${zeropsSubdomain}
        APP_URL: ${APP_URL}
        DEV_APP_URL: ${DEV_APP_URL}
        FRONTEND_URL: https://frontend-${zeropsSubdomainHost}.prg1.zerops.app
        DEV_FRONTEND_URL: https://frontenddev-${zeropsSubdomainHost}.prg1.zerops.app
      ports:
        - port: 3000
          httpSupport: true
      start: node .next/standalone/bin/run.mjs
      healthCheck:
        httpGet:
          port: 3000
          path: /api/access

  - setup: dev
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@24
      os: ubuntu
      envVariables:
        NODE_ENV: development
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        SERVER_URL: ${DEV_API_URL}
        APP_URL: ${DEV_APP_URL}
        DEV_APP_URL: ${DEV_APP_URL}
        DEV_API_URL: ${DEV_API_URL}
      ports:
        - port: 3000
          httpSupport: true
      start: zsc noop --silent
